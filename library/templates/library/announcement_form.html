{% extends 'base.html' %}

{% block title %}Publish Announcement - SmartLibrary{% endblock %}
{% block page_title %}Publish Announcement{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="card border-0 rounded-4 shadow-sm p-4 mx-auto" style="max-width: 600px;">
        <h5 class="fw-bold mb-4">New Announcement Details</h5>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Title</label>
                {{ form.title }}
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary">Target Audience</label>
                {{ form.target_role }}
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary">Content Body</label>
                {{ form.content }}
            </div>
            
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary rounded-3 px-4 border-0" style="background: var(--primary-gradient);">Publish Announcement</button>
                <a href="{% url 'announcement_list' %}" class="btn btn-light rounded-3 px-4">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
